# 可复用的 Node 仓库检查流程。调用方：
#
#   jobs:
#     check:
#       uses: lattefox/dev-config/.github/workflows/node-check.yml@v1
#       with:
#         prisma: true
#         postgres: true          # 启动 Postgres，连接串 postgresql://ci:ci@localhost:5432/ci
#         test: true
#         test-script: test:ci    # 迁移、种子、单测、E2E 都写在这个脚本里
#         env: |
#           DATABASE_URL=postgresql://ci:ci@localhost:5432/ci
name: Node check

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      prisma:
        description: 安装后执行 prisma generate
        type: boolean
        default: false
      test:
        description: 执行测试（Tier 1 仓库开启）
        type: boolean
        default: false
      test-script:
        description: 测试用的 package script
        type: string
        default: test
      postgres:
        description: 启动 Postgres 16 服务容器（用户、密码、库名都是 ci）
        type: boolean
        default: false
      unused:
        description: 执行 pnpm lint:unused（knip 报告清零后开启）
        type: boolean
        default: false
      build:
        type: boolean
        default: true
      env:
        description: 多行 KEY=VALUE，写入 GITHUB_ENV，仅用于 CI 占位值，不要放真实密钥
        type: string
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # image 为空时不启动服务
        image: ${{ inputs.postgres && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Export CI env
        if: inputs.env != ''
        run: printf '%s\n' "${{ inputs.env }}" >> "$GITHUB_ENV"

      # 版本取自调用方 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate
        if: inputs.prisma
        run: pnpm prisma generate

      - name: Format, lint, type-check
        run: pnpm check

      - name: Unused code
        if: inputs.unused
        run: pnpm lint:unused

      - name: Test
        if: inputs.test
        run: pnpm run ${{ inputs.test-script }}

      - name: Build
        if: inputs.build
        run: pnpm build
